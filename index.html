<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Chat Widget</title>
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-color: #fdfaf6;
            --bubble-color: #dcb8b8;
            --text-color: #333333;
            --border-color: #e5dada;
            --cat-btn-color: #fce4ec; /* Rosa pálido por defecto */
            --widget-font: 'Inter', system-ui, sans-serif;
            --bg-image: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--widget-font);
        }

        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal */
        .widget-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 600px;
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* Cuadrícula estilo Notion (se superpone si no hay imagen de fondo) */
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        /* Cabecera */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(253, 250, 246, 0.85);
            backdrop-filter: blur(5px);
            border-bottom: 2px solid var(--border-color);
            z-index: 10;
        }

        .header button {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
        }
        .header button:hover { color: #333; }

        .chat-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #555;
            background: #fff;
            padding: 5px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .chat-title img { width: 16px; height: 16px; border-radius: 4px; object-fit: cover; }

        /* Área de Mensajes */
        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1;
        }

        .message {
            align-self: flex-end;
            background-color: var(--bubble-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            max-width: 80%;
            word-wrap: break-word;
            position: relative;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
        }

        /* Recuadro de hora super compacto */
        .timestamp {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.8);
            text-align: right;
            margin-top: 4px;
            display: block;
        }

        /* Barra Inferior */
        .input-area {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #fff;
            border-top: 2px solid var(--border-color);
            z-index: 10;
            gap: 10px;
        }

        /* Ocultar input nativo */
        .input-area input[type="file"] {
            display: none;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { color: #666; }

        .input-area input[type="text"] {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        /* Botón rosa pálido */
        .pale-pink-btn {
            background-color: var(--cat-btn-color);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #555;
            transition: transform 0.2s;
        }
        .pale-pink-btn:hover { transform: scale(1.1); }

        /* Botón Luna */
        .moon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .moon-btn:hover { transform: scale(1.1); }

        /* Modales (Ajustes, Menús, Recorte) */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        .modal h3 { font-size: 1rem; margin-bottom: 15px; color: #333; }
        .setting-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .setting-group label { font-size: 0.8rem; color: #666; }
        .setting-group input[type="color"] { border: none; width: 100%; height: 30px; cursor: pointer; }
