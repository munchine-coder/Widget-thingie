<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Chat Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-body: transparent; /* Por defecto transparente para Notion */
            --bg-pattern: none;
            --color-bar: #fdfbfb;
            --color-bubble: #e2c0c6;
            --color-cat-btn: #f4d3d9; /* Rosa pálido por defecto */
            --color-chat-bg: transparent;
            --widget-scale: 1;
        }

        body {
            background-color: var(--bg-body);
            background-image: var(--bg-pattern);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease;
        }

        .widget-container {
            width: 360px;
            height: 600px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(var(--widget-scale));
            transform-origin: center;
        }

        .top-bar {
            background: var(--color-bar);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f3f4f6;
            position: relative;
        }

        .chat-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: var(--color-chat-bg);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            background: var(--color-bubble);
            color: #374151;
            align-self: flex-end;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0
