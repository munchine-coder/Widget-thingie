<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List Sincronizado</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --accent: #7fa1fc;
    --accent-hover: #6c91fb;
    --bg: #ffffff;
    --text: #2f3d59;
    --muted: #8993a6;
    --line: #edf0f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:transparent;font-family:'Inter',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .widget{width:380px;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.04);overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:14px}
  .top-bar{display:flex;align-items:center;justify-content:space-between}
  .view-selector{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text);font-size:14px;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px}
  .view-selector:hover{background:#f4f6fb}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px;border-radius:6px;display:grid;place-items:center}
  .icon-btn:hover{background:#f4f6fb;color:var(--text)}
  .input-group{display:flex;gap:8px}
  input[type="text"]{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:10px;outline:none;color:var(--text);font-size:13px;background:#fafbfe}
  input[type="text"]:focus{border-color:var(--accent);background:#fff}
  .add-btn{background:var(--accent);color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:18px;transition:.15s}
  .add-btn:hover{background:var(--accent-hover)}
  .task-list{list-style:none;padding:0;margin:0;max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .task-item{display:flex;align-items:center;justify-content:space-between;padding:8px 6px;border-radius:8px;transition:.1s}
  .task-item:hover{background:#f9fafd}
  .task-content{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;overflow:hidden}
  .checkbox{width:18px;height:18px;border:2px solid var(--accent);border-radius:4px;display:grid;place-items:center;flex-shrink:0;transition:.1s}
  .task-item.completed .checkbox{background:var(--accent);border-color:var(--accent)}
  .task-item.completed .checkbox::after{content:'✓';color:#fff;font-size:11px;font-weight:bold}
  .task-item.completed span{text-decoration:line-through;color:var(--muted)}
  .task-text{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .delete-btn{background:none;border:none;color:#d0d7de;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:4px;opacity:0;transition:.1s}
  .task-item:hover .delete-btn{opacity:1}
  .delete-btn:hover{color:#e5534b;background:#fdf3f2}
  .footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px;font-size:11px;color:var(--muted)}
  .clear-btn{background:none;border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px;transition:.15s}
  .clear-btn:hover{background:#f4f6fb;border-color:#d0d7de}
</style>
</head>
<body>

<div class="widget">
  <div class="top-bar">
    <button class="view-selector">📅 Hoy ▾</button>
    <button class="icon-btn" title="Sincronizado con Supabase">⚙️</button>
  </div>
  
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Añadir nueva tarea...">
    <button class="add-btn" id="addBtn">＋</button>
  </div>

  <ul class="task-list" id="taskList"></ul>
  
  <div class="footer">
    <span id="taskStats">0/0 completadas</span>
    <button class="clear-btn" id="clearBtn">Limpiar completadas</button>
  </div>
</div>

<script>
  // --- CONFIGURACIÓN DE SUPABASE ---
  const SUPABASE_URL = 'https://uodmqghejelynqwyuaip.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvZG1xZ2hlamVseW5xd3l1YWlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMTIzODIsImV4cCI6MjEwNzc4ODM4Mn0.Bq2yODlhA8dTwCyEYQn5kLjLVtQEVn3-1sFzmcCTHLc';

  let _supabase;
  try {
    const { createClient } = supabase;
    _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e) {
    console.error("Error al iniciar Supabase", e);
  }

  const WIDGET_ID = 'mi_todo_principal';
  let tasks = [];

  async function loadTasks() {
    if (!_supabase) return;
    try {
      let { data, error } = await _supabase
        .from('todo_widget')
        .select('*')
        .eq('id', WIDGET_ID)
        .maybeSingle();

      if (error) throw error;

      if (data && data.content) {
        tasks = data.content;
        render();
      } else {
        await _supabase.from('todo_widget').upsert({ id: WIDGET_ID, content: [] });
        render();
      }
    } catch (err) {
      console.error("Error al cargar de Supabase:", err);
    }
  }

  async function saveTasks() {
    if (!_supabase) return;
    try {
      const { error } = await _supabase
        .from('todo_widget')
        .upsert({ id: WIDGET_ID, content: tasks });

      if (error) throw error;
    } catch (err) {
      console.error("Error al guardar en Supabase:", err);
    }
  }

  function render() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    
    tasks.forEach((task, index) => {
      const li = document.createElement('li');
      li.className = `task-item ${task.completed ? 'completed' : ''}`;
      li.innerHTML = `
        <div class="task-content" onclick="toggleTask(${index})">
          <div class="checkbox"></div>
          <span class="task-text">${escapeHtml(task.text)}</span>
        </div>
        <button class="delete-btn" onclick="deleteTask(event, ${index})">×</button>
      `;
      list.appendChild(li);
    });

    const completedCount = tasks.filter(t => t.completed).length;
    document.getElementById('taskStats').textContent = `${completedCount}/${tasks.length} completadas`;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  window.toggleTask = function(index) {
    tasks[index].completed = !tasks[index].completed;
    render();
    saveTasks();
  }

  window.deleteTask = function(e, index) {
    e.stopPropagation();
    tasks.splice(index, 1);
    render();
    saveTasks();
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, completed: false });
    input.value = '';
    render();
    saveTasks();
  });

  document.getElementById('taskInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.completed);
    render();
    saveTasks();
  });

  loadTasks();
</script>

</body>
</html>
